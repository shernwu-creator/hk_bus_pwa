<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="香港巴士實時到站 PWA：以 GPS 定位查詢 500 公尺內九巴 (KMB)、城巴 (CTB) 與專線小巴 (GMB) 站點的路線、票價與最近三班車到站時間。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HK Bus" />
    <title>香港巴士實時到站｜HK Bus ETA</title>
    <script>
      // 在第一次繪製前套用主題，避免深色模式閃爍（與 src/hooks/useTheme.js 共用同一個 key）
      try {
        var storedTheme = localStorage.getItem('hkb:theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var useDark = storedTheme ? storedTheme === 'dark' : prefersDark
        document.documentElement.classList.toggle('dark', useDark)
        if (useDark) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#020617')
        }
      } catch (error) {
        console.warn('無法套用主題設定', error)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
